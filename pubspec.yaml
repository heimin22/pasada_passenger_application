name: pasada_passenger_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.5.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  app_links: ^6.4.1
  bcrypt: ^1.1.3
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  dio: ^5.9.0
  dotenv: ^4.2.0
  firebase_auth: ^6.0.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  firebase_performance: ^0.11.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_background_service: ^5.1.0
  flutter_dotenv: ^6.0.0
  flutter_google_maps_webservices: ^1.1.1
  flutter_image_compress: ^2.4.0
  flutter_isolate: ^2.1.0
  flutter_local_notifications: ^21.0.0
  flutter_markdown: ^0.7.7
  flutter_native_splash: ^2.4.6
  flutter_polyline_points: ^3.0.1
  flutter_svg: ^2.1.0
  flutter_typeahead: ^5.2.0
  fluttertoast: ^9.0.0
  font_awesome_flutter: ^11.0.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get: ^4.6.6
  google_maps_flutter: ^2.13.1
  google_maps_flutter_android: ^2.14.11
  gotrue: ^2.11.1
  http: ^1.5.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  location: ^8.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  provider: ^6.1.5
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  supabase: ^2.6.1
  supabase_flutter: ^2.8.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  vector_graphics: ^1.1.18
  webview_flutter: ^4.10.0

dev_dependencies:
  build_runner: ^2.4.14
  coverage: ^1.11.1
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.2
  logger: ^2.5.0
  mockito: ^5.4.5
  test: ^1.25.8

flutter_launcher_icons:
  android: true
  remove_alpha_ios: true
  ios: true
  image_path: "assets/png/pasada_app_icon_store.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    # Critical navigation assets
    - assets/svg/pasadaLogoWithoutText.svg
    - assets/svg/homeIcon.svg
    - assets/svg/homeSelectedIcon.svg
    - assets/svg/activityIcon.svg
    - assets/svg/activitySelectedIcon.svg
    - assets/svg/notificationIcon.svg
    - assets/svg/notificationSelectedIcon.svg
    - assets/svg/profileIcon.svg
    - assets/svg/profileSelectedIcon.svg
    - assets/svg/settingsIcon.svg
    - assets/svg/settingsSelectedIcon.svg
    - assets/svg/accountSelectedIcon.svg

    # Map and location assets
    - assets/svg/locationPin.svg
    - assets/svg/navigation.svg
    - assets/svg/pickupPin.svg
    - assets/svg/pindropoff.svg
    - assets/svg/pinpickup.svg

    # Transportation assets
    - assets/svg/bus.svg
    - assets/png/bus.png
    - assets/png/bus_h.png
    - assets/png/pin_pickup.png
    - assets/png/pin_dropoff.png

    # Branding and social assets
    - assets/svg/googleIcon.svg
    - assets/svg/viberIcon.svg
    - assets/svg/phFlag.svg

    # App icons
    - assets/png/pasada_main_app_icon.png
    - assets/png/pasada_app_icon_text_colored.png
    - assets/png/pasada_app_icon_text_white.png
    - assets/png/pasada_app_icon_store.png
    - assets/png/pasada_white_brand.png

    # User profile assets
    - assets/svg/default_user_profile.svg
    - assets/png/default_user_profile.png

    # Content assets
    - assets/md/privacy_policy.md
    - assets/md/terms_and_conditions.md
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: fonts/Inter_18pt-Black.ttf
          weight: 900
        - asset: fonts/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
